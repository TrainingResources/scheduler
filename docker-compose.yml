services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: scheduler
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:7.4
    command: ["redis-server", "--appendonly", "no", "--save", ""]
    ports:
      - "6379:6379"

volumes:
  postgres-data:
